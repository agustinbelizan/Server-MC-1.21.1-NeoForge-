#Which release of the mod's defaults this file was last brought up to.
#Leave it alone. When it falls behind the build, the mod resets the
#handful of values whose defaults have moved since, and says so in the
#log -- see the class note in BackToGreeceConfig for why that is not an
#impertinence but the only way a corrected default ever reaches anyone.
# Default: 0
# Range: 0 ~ 1000
fileVersion = 4

[glory]
	#Global multiplier on all weighted glory gains. 1.0 is the original curve, which is a long grind; 5.0 is a "see the content" setting for a short playthrough.
	# Default: 2.0
	# Range: 0.0 ~ 1000.0
	gloryMultiplier = 2.0
	#Fraction of current-level progress lost when killed by an enemy-nation NPC. Levels are never lost.
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	deathProgressPenalty = 0.1
	#Whether killing an opposing-nation player awards glory (at Hoplite weight).
	pvpGloryEnabled = false
	#Glory lost for killing one of your own nation, as a multiple of what the same kill would have been worth against the enemy. Levels and bands can be lost. 0 turns treachery off.
	# Default: 3.0
	# Range: 0.0 ~ 100.0
	treacheryMultiplier = 3.0

	[glory.weights]
		# Default: 0.05
		# Range: 0.0 ~ 1000.0
		hostileMob = 0.05
		# Default: 0.25
		# Range: 0.0 ~ 1000.0
		peasant = 0.25
		# Default: 0.75
		# Range: 0.0 ~ 1000.0
		archer = 0.75
		# Default: 1.0
		# Range: 0.0 ~ 1000.0
		hoplite = 1.0
		# Default: 3.0
		# Range: 0.0 ~ 1000.0
		elite = 3.0
		# Default: 25.0
		# Range: 0.0 ~ 1000.0
		captain = 25.0

[party]
	#-1 = use the glory band table.
	# Default: -1
	# Range: -1 ~ 100
	maxPartySizeOverride = -1
	#Party members are permanently lost after this many deaths. 0 = disabled.
	# Default: 3
	# Range: 0 ~ 100
	permadeathAfterDeaths = 3
	#In-game days between upkeep payments for summoned-at-least-once party members.
	# Default: 3
	# Range: 1 ~ 100
	upkeepIntervalDays = 3
	#Whether party members may damage parties of other same-nation players.
	friendlyFireSameNation = false

[world]
	# Default: 20
	# Range: 1 ~ 10000
	warGroupSpawnIntervalMinutes = 20
	# Default: 6
	# Range: 0 ~ 100
	maxConcurrentWarGroups = 6
	#Whether war groups that reach a city start a siege (vs. despawning).
	siegesEnabled = true
	#Set false while editing structures in-game. npc_spawner marker blocks
	#normally spawn their NPC and delete themselves on their first tick, which
	#would strip every spawner out of a structure you placed to edit. With this
	#off they sit inert, so the structure can be re-saved with its markers intact.
	npcSpawnersEnabled = true

[city]
	#Smallest city, in buildings, counting the megaron and the civic
	#buildings. A city of 22 is a village: the megaron, a shrine, a market,
	#a hospital, three barracks and thirteen or so houses and farms.
	#Since every city now garrisons at least three barracks, seven of any
	#city's buildings are spoken for before a single house is placed --
	#which is why the floor sits where it does. Much below twenty and the
	#place reads as a compound rather than as somewhere people live.
	# Default: 22
	# Range: 6 ~ 200
	minBuildings = 22
	#Largest city, in buildings. Each city rolls a target between the two,
	#weighted toward the small end so a great city stays a landmark, and the
	#walls are drawn to fit it -- up to whatever maxCityDiameter below allows.
	#A building count whose natural footprint would need more room than that
	#is simply packed as densely as it fits instead; see maxCityDiameter.
	# Default: 120
	# Range: 6 ~ 200
	maxBuildings = 120
	#Hard ceiling on a city's wall footprint (wall to opposite wall,
	#including both walls), in blocks. maxBuildings alone used to be the only
	#size knob, and its own doc undersold what that meant: at the default 120
	#it asks for a footprint of roughly 265 blocks across, more than twice
	#this cap. This is checked after that sizing math and clamps it down, so
	#raising maxBuildings past what this allows densifies a city instead of
	#growing its walls further -- the same graceful crowding a hand-built
	#layout already falls back on when it runs out of room.
	#
	#This is enforced as a veto now, not a clamp (see CityStructure), so a
	#value below what the smallest city minBuildings allows can actually build
	#at vetoes every candidate at every site and no city ever generates
	#anywhere -- not a hypothetical: the default here was 128 and the default
	#minBuildings (22) has needed 132 ever since a city started garrisoning
	#three barracks minimum, so out of the box nothing ever placed at all. That
	#worked out to 108 blocks of civic space alone before a single house or farm
	#is added, which is what pushed the floor candidate's own natural size past
	#the old cap. CityStructure now refuses to let this value alone zero out
	#every city in the world as a second line of defence, but the default and
	#the floor below are still meant to hold on their own without relying on
	#that -- do not lower either without re-checking CityPlan.interiorFor's
	#actual output at the current minBuildings default.
	# Default: 160
	# Range: 140 ~ 512
	maxCityDiameter = 160
	#Wall height of the smallest city. Must leave room for the gate arch:
	#below 6 the gateway is cut down to fit.
	# Default: 5
	# Range: 3 ~ 32
	minWallHeight = 5
	#Wall height of the largest city. Cities in between scale with their size,
	#give or take a block, so how high the wall stands tells you what you are
	#walking up to before you can count its roofs.
	# Default: 13
	# Range: 3 ~ 32
	maxWallHeight = 13
	#How far the towers at the corners of the outline rise above the wall.
	# Default: 4
	# Range: 0 ~ 16
	towerExtraHeight = 4
	#Wall thickness in blocks. Also the depth of a gateway passage.
	# Default: 2
	# Range: 1 ~ 5
	wallThickness = 2
	#Real minutes between a city taking in one new inhabitant to replace
	#one it has lost. A city that has been fought through fills back up
	#slowly instead of standing empty for the rest of the world's life.
	#Set to 0 to leave the dead uncounted and the streets empty.
	# Default: 4
	# Range: 0 ~ 240
	citizenRespawnMinutes = 4
	#Hard ceiling on how many inhabitants a city will ever hold. Counted
	#across every role that lives in the city, so a city cannot be farmed
	#into an infinite source of soldiers or coins.
	# Default: 40
	# Range: 0 ~ 400
	maxCityPopulation = 40
	#Refuse natural monster spawns inside a city's walls. A walled city with
	#a garrison in it does not have skeletons appearing in its side streets,
	#and the ones that did were fought by the garrison overnight -- so a city
	#left alone was quietly short of soldiers by morning. Only the darkness
	#spawner is refused: spawners, eggs, commands, anything that wanders in
	#from the fields, and everything the mod itself sends are untouched.
	peacefulCities = true
	#In-game days a conquered city sits kingless before it crowns a new
	#king of its conqueror's nation on its own -- no siege can be run against
	#it and no soldiers return to its garrison until it does. Time spent
	#under siege counts toward this, since the clock starts at the old king's
	#death, not at the moment the city actually falls.
	# Default: 3
	# Range: 1 ~ 60
	coronationDays = 3

	#The blocks each nation's walls, streets and ground are laid in.
	#Full block IDs; an unknown one falls back to the built-in default.
	[city.blocks]

		[city.blocks.mycenae]
			wall = "minecraft:stone_bricks"
			#Battlement merlons and gate lintels.
			accent = "minecraft:deepslate_bricks"
			ground = "minecraft:grass_block"
			road = "minecraft:gravel"
			#Packed under every column down to solid ground.
			foundation = "minecraft:stone"

		[city.blocks.troy]
			wall = "minecraft:smooth_sandstone"
			accent = "minecraft:terracotta"
			ground = "minecraft:sand"
			road = "minecraft:gravel"
			foundation = "minecraft:sandstone"

[divine]
	#Maximum altars a single player may claim per god.
	# Default: 3
	# Range: 1 ~ 100
	maxAltarsPerGod = 3
	# Default: 35
	# Range: 1 ~ 120
	favorPerAltar = 35
	#Whether sacrificing to a god drains favor with rival gods.
	rivalryEnabled = true
	#How long a god's standing blessing lasts after a sacrifice, in real
	#minutes. The tier-1 gifts -- Poseidon's breath underwater, Athena's
	#guard, Hades' eye for ore -- run on this clock and lapse when it does,
	#so an altar is somewhere you come back to rather than somewhere you
	#went once. Favor itself is not lost; only the blessing goes quiet.
	#Set to 0 to make them permanent again.
	# Default: 20
	# Range: 0 ~ 1440
	blessingMinutes = 20

[economy]
	#Whether dying with a gold coin in your inventory spends the coin and
	#saves everything else. Off by default: overruling keepInventory on a
	#condition this easy to meet by accident reads as a bug, not a myth.
	charonsObolEnabled = false
	#Whether a conquered city's king pays out an accruing silver tribute
	#when you speak to him. A nation's own founding capital never accrues
	#anything -- only a city taken by siege does.
	tributeEnabled = true

#Something happens every minDays to maxDays, and how far toward
#minDays depends on how well the best-standing player online stands
#with any one god. Attention is not protection: a player the gods have
#noticed gets the gifts and the reprisals alike, more often. Set both
#to the same number for a fixed cadence.
[events]
	#In-game days between events for a player at a god's third tier.
	# Default: 10
	# Range: 0 ~ 400
	minDaysBetweenEvents = 10
	#In-game days between events for a player no god has heard of.
	# Default: 30
	# Range: 0 ~ 400
	maxDaysBetweenEvents = 30
	trojanHorseEnabled = true
	poseidonStormEnabled = true
	zeusJudgmentEnabled = true
	zeusWarriorsEnabled = true
	hadesRisingEnabled = true
	heraEnvyEnabled = true
	hermesCaravanEnabled = true
	artemisHuntEnabled = true
	dionysusRitesEnabled = true
	nemeanBeastEnabled = true
	erisAppleEnabled = true

[relics]
	#One olive tree per this many chunks, on average. 12000 chunks is
	#roughly one tree in a thousand-block radius, which is a long walk --
	#lower it if you would rather find one than hear about one.
	# Default: 12000
	# Range: 1 ~ 100000
	oliveTreeRarity = 12000
	#Whether each god's altar rite needs that god's relic to finish.
	#Turning this off leaves the relics as pure consumables and makes
	#divine favor reachable without ever leaving the neighbourhood.
	relicsRequiredAtAltars = true

#The five god enchantments (S6.11). They are not in the enchanting
#table pool -- a priest hands you the book when the god thinks you have
#earned it, and you put it on your own armour at an anvil.
[enchantments]
	godEnchantmentsEnabled = true
	#Chance that a hit calls the storm down. Flat, not per level: the level decides how many bolts fall and how hard they land, not how often.
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	zeusStrikeChance = 0.1
	#Minimum seconds between two of a player's lightning strikes, so a run of good rolls cannot chain them.
	# Default: 5
	# Range: 0 ~ 600
	zeusStrikeCooldownSeconds = 5

[legacy]
	#Gold coins paid for killing a city's named champion.
	# Default: 6
	# Range: 0 ~ 64
	championBountyGold = 6
	#Weighted glory for killing a named champion. A captain is 25.
	# Default: 60.0
	# Range: 0.0 ~ 1000.0
	championGlory = 60.0
	#Whether a siege that kills every defender flips the city to the besieging nation.
	citiesCanFall = true
	#Gold coins for one barracks upgrade; each adds a warband slot.
	# Default: 12
	# Range: 1 ~ 128
	barracksUpgradeGold = 12
	#How many warband slots can be bought in total.
	# Default: 4
	# Range: 0 ~ 16
	maxBarracksUpgrades = 4
