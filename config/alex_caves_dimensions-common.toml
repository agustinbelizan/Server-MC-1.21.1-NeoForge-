#World generation settings for Prismatic Depths. Changes apply to newly generated chunks after restarting the world.
[prismatic_depths]
	#Choose either climate-based mixing or stacked vertical layers.
	#Allowed Values: MULTI_NOISE, VERTICAL
	generation_mode = "MULTI_NOISE"
	#Number of Alex's Caves biomes mixed into Prismatic Depths, from 2 to 6.
	# Default: 6
	# Range: 2 ~ 6
	mixed_dimension_count = 6

	#Settings used only by horizontal generation mode.
	[prismatic_depths.horizontal]
		#Choose one spatial frequency for all horizontal biomes or configure each biome frequency individually.
		#Allowed Values: UNIFORM, INDIVIDUAL
		horizontal_density_mode = "UNIFORM"
		#Biome sampling-coordinate multiplier for all horizontal biomes. 1.0 keeps the original scale, values below 1.0 create larger regions, and values above 1.0 create smaller regions.
		# Default: 1.0
		# Range: 0.01 ~ 10.0
		horizontal_biome_sample_multiplier = 1.0
		#Temperature and humidity centers for active biomes, paired in vertical_layer_order order.
		multi_noise_centers = [-6000, -5000, 0, -5000, 6000, -5000, -6000, 5000, 0, 5000, 6000, 5000]

		#Biome sampling-coordinate multipliers for individual Alex's Caves biomes. 1.0 keeps the original scale and zero disables that biome. If every active biome is zero, all active biomes use 1.0 at runtime.
		[prismatic_depths.horizontal.individual_biome_sample_multiplier]
			#Biome sampling-coordinate multiplier for alexscaves:primordial_caves. 1.0 keeps the original scale, values below 1.0 create larger regions, values above 1.0 create smaller regions, and zero disables this biome.
			# Default: 1.0
			# Range: 0.0 ~ 10.0
			primordial_caves = 1.0
			#Biome sampling-coordinate multiplier for alexscaves:toxic_caves. 1.0 keeps the original scale, values below 1.0 create larger regions, values above 1.0 create smaller regions, and zero disables this biome.
			# Default: 1.0
			# Range: 0.0 ~ 10.0
			toxic_caves = 1.0
			#Biome sampling-coordinate multiplier for alexscaves:magnetic_caves. 1.0 keeps the original scale, values below 1.0 create larger regions, values above 1.0 create smaller regions, and zero disables this biome.
			# Default: 1.0
			# Range: 0.0 ~ 10.0
			magnetic_caves = 1.0
			#Biome sampling-coordinate multiplier for alexscaves:forlorn_hollows. 1.0 keeps the original scale, values below 1.0 create larger regions, values above 1.0 create smaller regions, and zero disables this biome.
			# Default: 1.0
			# Range: 0.0 ~ 10.0
			forlorn_hollows = 1.0
			#Biome sampling-coordinate multiplier for alexscaves:candy_cavity. 1.0 keeps the original scale, values below 1.0 create larger regions, values above 1.0 create smaller regions, and zero disables this biome.
			# Default: 1.0
			# Range: 0.0 ~ 10.0
			candy_cavity = 1.0
			#Biome sampling-coordinate multiplier for alexscaves:abyssal_chasm. 1.0 keeps the original scale, values below 1.0 create larger regions, values above 1.0 create smaller regions, and zero disables this biome.
			# Default: 1.0
			# Range: 0.0 ~ 10.0
			abyssal_chasm = 1.0

	#Settings used only by vertical generation mode.
	[prismatic_depths.vertical]
		#Unique Alex's Caves biome paths from bottom to top. Only the first mixed_dimension_count entries are used.
		vertical_layer_order = ["primordial_caves", "toxic_caves", "magnetic_caves", "forlorn_hollows", "candy_cavity", "abyssal_chasm"]
		#Absolute block Y boundaries for the vertical layers. Use mixed_dimension_count + 1 ascending values from -64 to 320.
		vertical_layer_boundaries = [-64, 0, 64, 128, 192, 256, 320]
		#Vertical-mode entry biome path. Leave empty to use the normal top-down search.
		vertical_spawn_biome = ""
